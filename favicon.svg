<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="hubup-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D1526" />
      <stop offset="100%" stop-color="#07090E" />
    </linearGradient>
    <linearGradient id="hubup-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E5FF" />
      <stop offset="100%" stop-color="#2979FF" />
    </linearGradient>
    <radialGradient id="hubup-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00E5FF" stop-opacity="0.28" />
      <stop offset="100%" stop-color="#00E5FF" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Fundo arredondado dark tech -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#hubup-bg)" stroke="url(#hubup-cyan)" stroke-width="2" />
  <circle cx="32" cy="32" r="24" fill="url(#hubup-glow)" />

  <!-- Hexágono neon HubUP! -->
  <path
    d="M32 10L51 21V43L32 54L13 43V21L32 10Z"
    fill="rgba(0, 229, 255, 0.08)"
    stroke="url(#hubup-cyan)"
    stroke-width="3.2"
    stroke-linejoin="round"
  />

  <!-- Seta UP! branca centralizada -->
  <path
    d="M32 21V43M23 30L32 21L41 30"
    fill="none"
    stroke="#FFFFFF"
    stroke-width="3.8"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
</svg>
